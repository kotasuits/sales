<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tracking Portal — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --secondary: #a855f7;
            --bg: #0a0f1e;
            --card: rgba(20, 30, 55, 0.65);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --input-bg: rgba(10, 15, 30, 0.7);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(ellipse 80% 50% at 20% -10%, rgba(59, 130, 246, 0.15), transparent),
                radial-gradient(ellipse 60% 50% at 80% 110%, rgba(168, 85, 247, 0.15), transparent);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.5s ease both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--muted);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px 16px;
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: all 0.25s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Setup Toggle */
        .setup-toggle {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            text-decoration: underline;
            transition: color 0.2s;
        }

        .setup-toggle:hover {
            color: var(--text);
        }

        .setup-panel {
            margin-top: 20px;
            border-top: 1px dashed var(--border);
            padding-top: 20px;
            display: none;
        }

        .setup-panel textarea {
            width: 100%;
            height: 120px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            color: #a7f3d0;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            outline: none;
            margin-bottom: 12px;
            transition: border-color 0.25s;
        }

        .setup-panel textarea:focus {
            border-color: #10b981;
        }

        .btn-setup {
            width: 100%;
            padding: 11px;
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.1);
            color: #a7f3d0;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-setup:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.6);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--border);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.success { border-color: rgba(16, 185, 129, 0.4); color: #34d399; }
        .toast.error { border-color: rgba(239, 68, 68, 0.4); color: #f87171; }

        /* Loader */
        .loader {
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.25);
            color: #fbbf24;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="header">
            <h1>📦 Dispatch Admin</h1>
            <p>Sign in to manage tracking and print options</p>
        </div>

        <div id="no-config-warning" class="alert-warning" style="display: none;">
            ⚠️ <strong>Firebase Configuration Required</strong><br>
            Please configure your Firebase credentials in <code>firebase-config.js</code> to enable portal access.
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="admin@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" id="btn-submit" class="btn-submit">
                <span>Sign In</span>
            </button>
        </form>

        <div class="setup-toggle" onclick="toggleResetPanel()">🔑 Reset Password</div>
 
        <div id="reset-password-panel" class="setup-panel">
            <div class="form-group" style="margin-bottom: 16px;">
                <label for="reset-email">Email Address</label>
                <input type="email" id="reset-email" placeholder="admin@example.com" style="padding: 10px 12px; font-size: 14px;">
            </div>
            <button class="btn-setup" onclick="handleSendResetLink()">Send Reset Link</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // Check if config exists
        window.addEventListener('DOMContentLoaded', () => {
            if (!firebaseInitialized) {
                document.getElementById('no-config-warning').style.display = 'block';
                document.getElementById('btn-submit').disabled = true;
            } else {
                // If logged in, redirect immediately
                firebaseAuth.onAuthStateChanged(user => {
                    if (user) {
                        const redirectUrl = sessionStorage.getItem('redirectAfterLogin') || 'uploads.html';
                        sessionStorage.removeItem('redirectAfterLogin');
                        window.location.href = redirectUrl;
                    }
                });
            }
        });

        function showToast(msg, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show ' + type;
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        async function handleLogin(e) {
            e.preventDefault();
            if (!firebaseInitialized) {
                showToast('Please configure Firebase first!', 'error');
                return;
            }

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('btn-submit');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader"></div>';

            try {
                await firebaseAuth.signInWithEmailAndPassword(email, password);
                showToast('Authentication successful! redirecting...', 'success');
                setTimeout(() => {
                    const redirectUrl = sessionStorage.getItem('redirectAfterLogin') || 'uploads.html';
                    sessionStorage.removeItem('redirectAfterLogin');
                    window.location.href = redirectUrl;
                }, 1000);
            } catch (err) {
                console.error(err);
                showToast(err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Sign In</span>';
            }
        }

        function toggleResetPanel() {
            const p = document.getElementById('reset-password-panel');
            p.style.display = (p.style.display === 'block') ? 'none' : 'block';
        }

        async function handleSendResetLink() {
            if (!firebaseInitialized) {
                showToast('Firebase is not initialized yet.', 'error');
                return;
            }

            const email = document.getElementById('reset-email').value.trim();

            if (!email) {
                showToast('Please enter your email address.', 'error');
                return;
            }

            const btn = document.querySelector('#reset-password-panel .btn-setup');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                await firebaseAuth.sendPasswordResetEmail(email);
                showToast('Password reset link sent to your email!', 'success');
                document.getElementById('reset-email').value = '';
                toggleResetPanel();
            } catch (err) {
                console.error(err);
                showToast(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Send Reset Link';
            }
        }
    </script>
</body>
</html>
